[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gen_utils"
description = "common utility scripts"
readme = "README.md"
authors = [
  { name="Philip Austin", email="paustin@eoas.ubc.ca" },
]

dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "psutil",
  "netCDF4",
  "click",
  "nbformat",
  "pyyaml",
  "jupytext",
]

[project.optional-dependencies]
# pdf2myst backends; neither is on conda-forge
pdf = ["pymupdf4llm"]
marker = ["marker-pdf"]


[project.scripts]
killprocs = "gen_utils.utils.killprocs:main"
killjobs = "gen_utils.utils.killjobs:main"
pyncdump = "gen_utils.utils.ncdump:main"
set_execution = "gen_utils.utils.set_execution:main"
sync_recipe_version = "gen_utils.utils.sync_recipe_version:main"
pdf2myst = "gen_utils.utils.pdf2myst:main"
ports_in_use = "gen_utils.utils.ports_in_use:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_utils"]

[tool.hatch.build.hooks.vcs]
version-file = "src/gen_utils/_version.py"


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64", { name = "osx14-arm64", platform = "osx-arm64", macos = "14.0" }]
authors = ["Phil Austin <paustin@eos.ubc.ca>"]
name = "gen_utils"

[tool.pixi.dependencies]
python = ">3.12"
netcdf4 = "*"
hatch = ">=1.16.3,<2"
ghp-import = ">=2.1.0,<3"
jupyter-book = "*"
mystmd = ">=1.13.0,<2"
pytest = ">=9.2.0,<10"
rattler-build = "*"
setuptools_scm = ">=10.3.4,<11"
anaconda-auth = ">=0.15.3,<0.16"

[tool.pixi.tasks]
build-conda = "rm -rf output && rattler-build build --recipe recipe/recipe.yaml --output-dir output"

[tool.pixi.pypi-dependencies]
gen_utils = { path = ".", editable = true }




[tool.pytest.ini_options]
testpaths = ["tests"]

# "pdf" environment for pdf2myst development and tests: pixi run -e pdf pytest
# pymupdf4llm is not on conda-forge, so it stays out of [project].dependencies
# and the conda recipe. It depends on onnxruntime, which has no Python 3.15
# wheels yet, so this environment uses an older Python than the default one.
# onnxruntime's macOS wheels also need macOS 14+, hence the osx14-arm64
# platform (defined in [tool.pixi.workspace]) in place of plain osx-arm64.
[tool.pixi.feature.pdf]
platforms = ["osx14-arm64", "linux-64", "win-64"]

[tool.pixi.feature.pdf.dependencies]
python = ">=3.12,<3.15"

[tool.pixi.feature.pdf.pypi-dependencies]
pymupdf4llm = ">=2.1, <3"

[tool.pixi.environments]
pdf = ["pdf"]
