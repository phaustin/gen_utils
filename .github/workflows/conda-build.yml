name: test and build conda package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs needs the tags to compute the version

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
          locked: true     # fail if pixi.lock is out of date with pyproject.toml

      - name: run tests
        run: pixi run pytest

      - name: build and test conda package
        run: pixi run build-conda

      # the package is noarch, so one copy (from linux) is enough
      - name: upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gen_utils-conda
          path: output/noarch/*.conda

  # on a v* tag, upload to anaconda.org once all three platforms have passed
  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check tag matches recipe version
        run: |
          recipe_version=$(grep -m1 'version:' recipe/recipe.yaml | sed -E 's/.*"(.*)".*/\1/')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$recipe_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match recipe version $recipe_version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: gen_utils-conda
          path: dist

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false   # only rattler-build is needed, via pixi exec

      - name: upload to anaconda.org
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
        # channel defaults to the GitHub account; set the repository
        # variable ANACONDA_OWNER to upload somewhere else
        run: >
          pixi exec rattler-build upload anaconda
          --owner ${{ vars.ANACONDA_OWNER || github.repository_owner }}
          dist/*.conda
